name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands": [
                "sudo -u ec2-user test -d /home/ec2-user/demo-app",
                "sudo -u ec2-user git config --global --add safe.directory /home/ec2-user/demo-app",
                "sudo -u ec2-user bash -c \"cd /home/ec2-user/demo-app && git pull origin main\"",
                "sudo -u ec2-user bash -c \"cd /home/ec2-user/demo-app && npm install\"",
                "sudo -u ec2-user bash -c \"cd /home/ec2-user/demo-app && pm2 restart demo-app || pm2 start app.js --name demo-app\"",
                "sudo -u ec2-user pm2 save"
              ]
            }'

      - name: Wait For Deployment
        run: sleep 20

      - name: Health Check
        run: |
          curl -f http://${{ secrets.APP_HOST }}:3000
